<div class="bg-white border border-slate-200 rounded-xl shadow-2xl overflow-hidden w-[92vw] max-w-md">
  <div class="flex items-center justify-between p-4 border-b border-slate-200">
    <div>
      <h3 class="text-base font-bold text-slate-900">Ajustar Estoque</h3>
      <p class="text-xs font-mono text-slate-500 mt-0.5">{{ item.sku }} - {{ item.name }}</p>
    </div>
    <button
      type="button"
      (click)="onClose()"
      class="text-slate-400 hover:text-slate-700 p-1.5 rounded-lg transition-colors cursor-pointer"
    >
      <ng-icon name="heroXMarkSolid" class="text-lg" />
    </button>
  </div>

  <form [formGroup]="adjustForm" (ngSubmit)="onSubmit()">
    <div class="p-5 space-y-4">
      @if (errorMessage()) {
        <div class="p-3 rounded-lg bg-rose-50 border border-rose-200 text-rose-800 text-xs">
          {{ errorMessage() }}
        </div>
      }

      <div class="grid grid-cols-2 gap-2">
        <button
          type="button"
          (click)="setOperation('add')"
          [class]="adjustForm.get('operation')?.value === 'add'
            ? 'bg-emerald-50 border-emerald-500 text-emerald-800 font-bold shadow-xs'
            : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-white'"
          class="p-2.5 rounded-lg border text-xs flex items-center justify-center gap-1.5 transition-all cursor-pointer"
        >
          <span class="text-base font-bold text-emerald-600">+</span>
          <span>Entrada de Estoque</span>
        </button>

        <button
          type="button"
          (click)="setOperation('remove')"
          [class]="adjustForm.get('operation')?.value === 'remove'
            ? 'bg-rose-50 border-rose-500 text-rose-800 font-bold shadow-xs'
            : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-white'"
          class="p-2.5 rounded-lg border text-xs flex items-center justify-center gap-1.5 transition-all cursor-pointer"
        >
          <span class="text-base font-bold text-rose-600">-</span>
          <span>Saída de Estoque</span>
        </button>
      </div>

      <div class="p-3 rounded-lg bg-slate-50 border border-slate-200 flex items-center justify-between text-xs">
        <div>
          <span class="text-slate-500 block">Estoque Atual</span>
          <span class="font-bold text-slate-900 text-sm font-mono">{{ item.stock_quantity }} un</span>
        </div>
        <div class="text-right">
          <span class="text-slate-500 block">Estoque Projetado</span>
          <span class="font-bold text-sm font-mono" [class]="adjustForm.get('operation')?.value === 'add' ? 'text-emerald-700' : 'text-rose-700'">
            {{ newStockPreview() }} un
          </span>
        </div>
      </div>

      <app-text-input
        name="quantity"
        type="number"
        label="Quantidade"
        placeholder="Ex: 5"
        [required]="true"
        [full]="true"
      />

      <app-text-input
        name="reason"
        type="text"
        label="Motivo do Ajuste"
        placeholder="Ex: Produção concluída, Acerto de balanço, Venda balcão..."
        [required]="true"
        [full]="true"
      />
    </div>

    <div class="flex items-center justify-end gap-2.5 p-4 border-t border-slate-200 bg-slate-50">
      <app-button
        variant="secondary"
        size="md"
        type="button"
        (click)="onClose()"
      >
        Cancelar
      </app-button>

      <app-button
        variant="brand"
        size="md"
        type="submit"
        [loading]="isLoading()"
      >
        Confirmar Ajuste
      </app-button>
    </div>
  </form>
</div>
