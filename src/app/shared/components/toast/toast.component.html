<div class="fixed top-5 right-5 z-50 flex flex-col gap-2.5 max-w-sm w-full pointer-events-none px-4 sm:px-0">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="toast-item pointer-events-auto flex items-start gap-3 p-4 rounded-xl border shadow-lg backdrop-blur-xs transition-all duration-300"
      [class]="getToastClasses(toast.type)"
    >
      <div class="shrink-0 mt-0.5">
        <ng-icon [name]="getIconName(toast.type)" class="text-xl" />
      </div>

      <div class="flex-1 min-w-0">
        @if (toast.title) {
          <h4 class="text-sm font-semibold leading-tight text-main mb-1">
            {{ toast.title }}
          </h4>
        }
        <p class="text-xs font-normal leading-relaxed text-secondary break-words">
          {{ toast.message }}
        </p>
      </div>

      <button
        type="button"
        class="shrink-0 text-muted hover:text-main rounded-md p-1 transition-colors"
        (click)="toastService.remove(toast.id)"
        title="Fechar notificação"
      >
        <ng-icon name="heroXMarkSolid" class="text-base" />
      </button>
    </div>
  }
</div>
