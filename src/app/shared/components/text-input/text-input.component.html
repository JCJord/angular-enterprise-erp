<div class="flex flex-col gap-1.5" [class.w-full]="full()">
  @if (label()) {
    <label class="text-[13px] font-medium text-slate-700 flex items-center">
      {{ label() }}
      @if (required()) {
        <span class="text-rose-600 ml-0.5">*</span>
      }
    </label>
  }

  <div
    class="flex items-center relative bg-white border rounded-md transition-all duration-150"
    [class.border-slate-200]="!isInvalid"
    [class.focus-within:border-brand]="!isInvalid"
    [class.focus-within:ring-2]="!isInvalid"
    [class.focus-within:ring-brand/20]="!isInvalid"
    [class.border-rose-500]="isInvalid"
    [class.focus-within:border-rose-500]="isInvalid"
    [class.focus-within:ring-2]="isInvalid"
    [class.focus-within:ring-rose-500/20]="isInvalid"
    [class.bg-slate-50]="disabled()"
    [class.opacity-65]="disabled()"
    [class.cursor-not-allowed]="disabled()"
  >
    @if (effectivePrefixIcon(); as icon) {
      <span class="flex items-center justify-center text-slate-400 pl-3 shrink-0 pointer-events-none">
        <ng-icon [name]="icon" class="text-base" />
      </span>
    } @else if (prefix()) {
      <span class="flex items-center text-xs text-slate-400 pl-3 select-none">{{ prefix() }}</span>
    }

    @if (name()) {
      <input
        [formControlName]="name()"
        [type]="type()"
        [placeholder]="placeholder()"
        [disabled]="disabled()"
        class="w-full px-3 py-2 text-sm leading-5 text-slate-900 bg-transparent border-none outline-none rounded-md placeholder:text-slate-400 disabled:cursor-not-allowed"
        [class.font-mono]="mono()"
      />
    } @else {
      <input
        [value]="value()"
        [type]="type()"
        [placeholder]="placeholder()"
        [disabled]="disabled()"
        (input)="onInputChange($event)"
        class="w-full px-3 py-2 text-sm leading-5 text-slate-900 bg-transparent border-none outline-none rounded-md placeholder:text-slate-400 disabled:cursor-not-allowed"
        [class.font-mono]="mono()"
      />
    }

    @if (suffixIcon()) {
      <span class="flex items-center justify-center text-slate-400 pr-3 shrink-0 pointer-events-none">
        <ng-icon [name]="suffixIcon()!" class="text-base" />
      </span>
    } @else if (suffix()) {
      <span class="flex items-center text-xs text-slate-400 pr-3 select-none">{{ suffix() }}</span>
    }
  </div>

  @if (isInvalid) {
    <p class="text-xs text-rose-600 mt-0.5">{{ getFirstError() }}</p>
  } @else if (hint()) {
    <p class="text-xs text-slate-400 mt-0.5">{{ hint() }}</p>
  }
</div>
