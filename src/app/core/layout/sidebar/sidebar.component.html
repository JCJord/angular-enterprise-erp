<aside 
  class="bg-slate-900 text-slate-300 flex flex-col transition-all duration-300 border-r border-slate-800 select-none font-sans"
  [ngClass]="isCollapsed() ? 'w-20' : 'w-64'"
>
  <!-- Sidebar Header -->
  <div class="h-16 flex items-center justify-between px-4 border-b border-slate-800">
    @if (!isCollapsed()) {
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 min-w-[32px] min-h-[32px] shrink-0 rounded-lg bg-brand flex items-center justify-center font-bold text-white shadow-md">
          E
        </div>
        <div class="flex flex-col whitespace-nowrap overflow-hidden">
          <span class="font-bold text-sm tracking-wide text-white whitespace-nowrap">ENTERPRISE ERP</span>
          <span class="text-[10px] text-slate-400 font-mono whitespace-nowrap">WMS v1.0.0</span>
        </div>
      </div>
    } @else {
      <div class="w-8 h-8 min-w-[32px] min-h-[32px] shrink-0 mx-auto rounded-lg bg-brand flex items-center justify-center font-bold text-white shadow-md">
        E
      </div>
    }

    <!-- Toggle Button -->
    <button 
      (click)="toggleCollapse()"
      class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors shrink-0"
      [title]="isCollapsed() ? 'Expandir Menu' : 'Recolher Menu'"
    >
      <ng-icon [name]="isCollapsed() ? 'heroChevronRightSolid' : 'heroChevronLeftSolid'" class="text-base" />
    </button>
  </div>

  <!-- Navigation Links -->
  <nav class="flex-1 py-4 px-3 space-y-1.5 overflow-y-auto overflow-x-hidden">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-brand text-white font-semibold shadow-sm"
        [routerLinkActiveOptions]="{ exact: false }"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-all text-sm group whitespace-nowrap"
        [title]="isCollapsed() ? item.label : ''"
      >
        <ng-icon [name]="item.icon" class="text-lg flex-shrink-0 group-hover:scale-105 transition-transform" />
        
        @if (!isCollapsed()) {
          <span class="flex-1 truncate whitespace-nowrap">{{ item.label }}</span>
          
          @if (item.badge) {
            <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-slate-800 text-orange-400 whitespace-nowrap">
              {{ item.badge }}
            </span>
          }
        }
      </a>
    }
  </nav>

  <!-- Sidebar Footer -->
  <div class="p-3 border-t border-slate-800">
    @if (!isCollapsed()) {
      <div class="p-2.5 rounded-lg bg-slate-800/60 border border-slate-800 flex items-center gap-2.5 overflow-hidden">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse shrink-0"></div>
        <div class="flex flex-col whitespace-nowrap overflow-hidden">
          <span class="text-xs font-semibold text-slate-200 whitespace-nowrap">Sistema Conectado</span>
          <span class="text-[10px] text-slate-400 font-mono whitespace-nowrap">v1.0.0 - ALRA</span>
        </div>
      </div>
    } @else {
      <div class="w-3 h-3 mx-auto rounded-full bg-emerald-500 animate-pulse" title="Sistema Conectado (v1.0.0)"></div>
    }
  </div>
</aside>
